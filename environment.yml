# Conda environment for pyAutoGMX.
#
#   conda env create -f environment.yml
#   conda activate pyautogmx
#
# Use mamba instead of conda if you have it; solving this environment with
# plain conda can take several minutes.
#
# Optional structure curation (`fix_structure: yes` in gmx_config.txt) runs
# through a SEPARATE interpreter so that OpenMM does not have to share an
# environment with AmberTools. Create it only if you need that feature:
#
#   conda create -n pyautogmx-fixer -c conda-forge python=3.11 pdbfixer openmm
#
# then point `fixer_python` in gmx_config.txt at that environment's python.
name: pyautogmx
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - gromacs
  - ambertools
  - parmed
  - pytest
