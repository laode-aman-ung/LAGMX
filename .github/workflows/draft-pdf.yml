name: Draft PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Compile paper.md
    steps:
      - uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-pdf@master
        with:
          journal: joss
          paper-path: paper.md

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
